[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "sqlmodel>=0.0.38",
    "alembic>=1.18.4",
    "pydantic-settings>=2.14.1",
    "sentry-sdk[fastapi]>=2.60.0",
    "psycopg2-binary>=2.9.12",
    "asyncpg>=0.31.0",
    "python-multipart>=0.0.29",
    "fastmcp>=3.3.1",
    "pydantic-ai>=1.102.0",
    "pyjwt[crypto]>=2.12.1",
    "svix>=1.91.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "pip-audit>=2.10.0",
    "pip>=26.1",
    "ruff>=0.15.14",
    "ty>=0.0.37",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# SQLModel's column comparison operators (==, in_, not_in, etc.) return
# ColumnElement[bool], not bool. ty can't resolve this through SQLModel's
# __eq__ overloads, producing false positives on every .where()/.order_by()
# call. Downgrade to warnings so CI passes while keeping them visible.
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ty.rules]
invalid-argument-type = "warn"
invalid-return-type = "warn"
unresolved-attribute = "warn"
no-matching-overload = "warn"
invalid-assignment = "warn"
unsupported-operator = "warn"
